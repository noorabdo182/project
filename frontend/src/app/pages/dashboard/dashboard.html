<div class="dashboard">

  <h1>📚 Library Dashboard</h1>

  <div class="cards">

    <div class="card">
      <h2>📚 Total Books</h2>
      <p>{{ data.totalBooks }}</p>
    </div>

    <div class="card">
      <h2>✅ Available Books</h2>
      <p>{{ data.availableBooks }}</p>
    </div>

    <div class="card">
      <h2>❌ Unavailable Books</h2>
      <p>{{ data.unavailableBooks }}</p>
    </div>

    <div class="card">
      <h2>📖 Total Borrows</h2>
      <p>{{ data.totalBorrows }}</p>
    </div>

  </div>

</div>
